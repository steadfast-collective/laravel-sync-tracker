name: run-tests

on:
  push:
    branches: [ main, 'develop' ]
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest]
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
        stability: [prefer-lowest, prefer-stable]
        ## Test common combinations of Laravel to PHP (without running a zillion jobs)
        include:
          - php: 8.1
            laravel: 10.*
            testbench: 8.*
          - php: 8.2
            laravel: 10.*
            testbench: 8.*
          - php: 8.3
            laravel: 11.*
            testbench: ^9.6
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
          - php: 8.5
            laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      # Only analyse on the newest Laravel: PHPDoc relation generics differ
      # per Laravel version (e.g. MorphOne gained a 2nd template param after
      # L10), so running PHPStan on every matrix combo gives conflicting errors.
      - name: Run Static Analysis
        if: matrix.laravel == '13.*' && matrix.stability == 'prefer-stable'
        run: ./vendor/bin/phpstan --error-format=github

      - name: Execute tests
        run: vendor/bin/pest
