name: run-tests

on:
  push:
    branches: [ main, 'develop' ]
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest]
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
        stability: [prefer-lowest, prefer-stable]
        ## Database drivers each job runs against; the service containers and
        ## connection env below are derived from this value.
        db: [mysql, pgsql]
        ## Postgres: only run against Laravel 13 (PHP 8.5) for now — strip it
        ## from the older combinations. Remove an entry here to extend
        ## Postgres coverage to that PHP/Laravel version.
        exclude:
          - db: pgsql
            php: 8.1
          - db: pgsql
            php: 8.2
          - db: pgsql
            php: 8.3
          - db: pgsql
            php: 8.4
        ## Test common combinations of Laravel to PHP (without running a zillion jobs)
        include:
          - php: 8.1
            laravel: 10.*
            testbench: 8.*
          - php: 8.2
            laravel: 10.*
            testbench: 8.*
          - php: 8.3
            laravel: 11.*
            testbench: ^9.6
          - php: 8.4
            laravel: 12.*
            testbench: 10.*
          - php: 8.5
            laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.db }}

    ## A service whose image resolves to an empty string is skipped, so only
    ## the database selected by matrix.db is started.
    services:
      mysql:
        image: ${{ matrix.db == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -ppassword" --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_pgsql
          coverage: pcov

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      # Only analyse on the newest Laravel: PHPDoc relation generics differ
      # per Laravel version (e.g. MorphOne gained a 2nd template param after
      # L10), so running PHPStan on every matrix combo gives conflicting errors.
      - name: Run Static Analysis
        if: matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' && matrix.db == 'mysql'
        run: ./vendor/bin/phpstan --error-format=github

      - name: Execute tests
        run: vendor/bin/pest
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
